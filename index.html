<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>เครื่องมือวิเคราะห์ Mix Design (Marshall Method)</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">AC</div>
      <div class="brand-text">
        <div class="title">HMA Mix Design</div>
        <div class="subtitle">Marshall Method · ทล.-ม. 408/2532</div>
      </div>
    </div>

    <div class="nav-item active" data-tab="gradation"><span class="num">1</span> ขนาดคละมวลรวม</div>
    <div class="nav-item" data-tab="marshall"><span class="num">2</span> Marshall Test & OAC</div>
    <div class="nav-item" data-tab="rap"><span class="num">3</span> ตัวช่วยคำนวณมิกซ์ RAP</div>

    <div class="sidebar-footer">
      <button class="btn btn-ghost btn-sm" id="btnNewProject">+ ชุดข้อมูลใหม่</button>
      <button class="btn btn-ghost btn-sm" id="btnLoadDemo">โหลดตัวอย่างอ้างอิง</button>
      <button class="btn btn-ghost btn-sm" id="btnImportProject">⬆ นำเข้าไฟล์ข้อมูล (.json)</button>
      <button class="btn btn-primary btn-sm" id="btnSaveProject">⬇ บันทึกไฟล์ข้อมูล (.json)</button>
      <div class="credit-footer">
        พัฒนาโดย<br/>
        <span class="name">รศ.ดร.อิทธิพล มีผล</span><br/>
        ภาควิชาครุศาสตร์โยธา มจพ.
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1 id="pageTitle">วิเคราะห์ขนาดคละมวลรวม</h1>
        <div class="desc" id="pageDesc">เทียบขนาดคละกับช่วงมาตรฐาน พล็อตกราฟและ export ได้</div>
      </div>
      <span class="badge-course" id="courseBadge">-</span>
    </div>

    <div class="tabs-content">
      <section id="tab-gradation" class="active"><div id="gradationContainer"></div></section>
      <section id="tab-marshall"><div id="marshallContainer"></div></section>
      <section id="tab-rap"><div id="rapContainer"></div></section>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="importFileInput" accept="application/json" style="display:none" />

<script src="lib/chart.umd.min.js"></script>
<script src="js/data/doh-408-2532.js"></script>
<script src="js/modules/calculations.js"></script>
<script src="js/modules/oac.js"></script>
<script src="js/modules/gradation.js"></script>
<script src="js/charts/chart-helpers.js"></script>
<script src="js/storage.js"></script>
<script src="js/export-utils.js"></script>
<script src="js/demo-project.js"></script>
<script src="js/app.js"></script>
<script src="js/tabs/gradation-tab.js"></script>
<script src="js/tabs/marshall-tab.js"></script>
<script src="js/tabs/rap-tab.js"></script>

</html>
